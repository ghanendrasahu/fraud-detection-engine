version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ENABLED=false
      - MODEL_PATH=/app/models/fraud_model.onnx
      - XGBOOST_MODEL_PATH=/app/models/fraud_model.pkl
      - LOG_LEVEL=INFO
      - APP_ENV=development
    depends_on:
      - redis
    volumes:
      - ./models:/app/models
    networks:
      - fraud-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - fraud-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - fraud-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - fraud-net

  frontend:
    build:
      context: ./app/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge
